<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Spotify – právě hraje</title>
    <link rel="stylesheet" href="./panel.css" />
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script src="./panel.js" defer></script>
  </head>
  <body>
    <main class="panel" aria-live="polite">
      <header class="panel-header">
        <div>
          <p class="eyebrow">Spotify</p>
          <h1>Právě hraje</h1>
        </div>
        <span id="connection" class="connection" role="status">Připojuji…</span>
      </header>

      <section id="empty-state" class="empty-state">
        <p id="empty-title">Čekám na skladbu…</p>
        <span id="empty-detail">Údaje se zobrazí po odeslání přes Twitch PubSub.</span>
      </section>

      <section id="track" class="track" hidden aria-label="Aktuálně přehrávaná skladba">
        <div class="cover-frame">
          <img id="cover" class="cover" alt="" hidden />
          <span id="cover-placeholder" class="cover-placeholder" aria-hidden="true">♫</span>
        </div>
        <div class="track-details">
          <h2 id="track-name">—</h2>
          <p id="artists">—</p>
          <a id="spotify-link" class="spotify-link" target="_blank" rel="noopener noreferrer" hidden>
            Otevřít ve Spotify
          </a>
        </div>
      </section>

      <p id="error" class="error" hidden role="alert"></p>
      <p id="updated-at" class="updated-at" hidden></p>
    </main>
  </body>
</html>
